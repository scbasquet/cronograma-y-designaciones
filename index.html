<style>
:root{--tabla:#8E1B34;--tabla2:#5E1022;--chip:#151515;--led:#F5B301;--papel:#F0EEEF;--tinta:#1C2633;--gris:#5E6B7A;--linea:#D7DDE5;--ok:#2F8F5B;--mal:#C8372D;--cond:'Barlow Condensed','Arial Narrow',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:16px/1.45 Barlow,system-ui,-apple-system,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{background:var(--tabla);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 16px}
.hwrap,main{max-width:720px;margin:0 auto}
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:56px;height:56px;flex:none}
.marca .nom{flex:1;min-width:0}
.marca .app{font:800 22px/1.05 var(--cond)}
.marca .aso{font-size:13px;color:#EBC9D1}
.marca #ver{font:700 14px var(--cond);color:#EBC9D1;align-self:flex-start}
.finde{display:flex;align-items:center;gap:10px;margin-top:12px}
.finde h1{flex:1;margin:0;font:800 32px/1.02 var(--cond)}
.finde h1 small{display:block;font:600 15px Barlow,system-ui,sans-serif;color:#EBC9D1;margin-bottom:2px}
.finde button{background:var(--tabla2);border:0;color:#fff;width:44px;height:44px;border-radius:10px;font-size:20px;cursor:pointer}
.instalar{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--linea);border-left:5px solid var(--tabla);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.instalar span{flex:1}
.demo{background:var(--led);color:var(--tabla2);font-size:13px;padding:7px 16px;text-align:center}
main{padding:14px 16px 24px}
h2.dia{font:800 23px var(--cond);color:var(--tabla);margin:24px 0 8px}
.tira{background:#fff;border:1px solid var(--linea);border-radius:12px;margin-bottom:12px;overflow:hidden}
.tira-cab{padding:12px 14px 9px}
.tira-cab h3{margin:0;font:700 22px/1.12 var(--cond)}
.sub{color:var(--gris);font-size:14px}
.fila{display:grid;grid-template-columns:66px 1fr auto;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--linea)}
.fila.alerta{background:#FCEDEB}
.hora{background:var(--chip);color:var(--led);font:700 21px/1 var(--cond);text-align:center;border-radius:6px;padding:6px 0;font-variant-numeric:tabular-nums;letter-spacing:1px}
.cat{font-weight:700}
.arb{font-size:14px;color:var(--gris)}
.costo{font:600 16px var(--cond);color:var(--gris)}
.msg{color:var(--mal);font-size:13px;font-weight:600;margin-top:4px}
.pie{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:#F6F8FA;border-top:1px solid var(--linea);font-size:14px}
.monto{font:700 20px var(--cond);color:var(--tinta)}
.monto.grande{font-size:30px;display:block;line-height:1.05}
.estado{display:inline-block;font-weight:700;color:var(--mal)}
.estado.ok{color:var(--ok)}
.barra{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barra select{flex:1 1 180px}
.panel{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font:800 24px var(--cond);color:var(--tabla)}
.cabclub{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.cabclub h2{margin:0;font:800 28px/1.05 var(--cond);color:var(--tabla)}
.resumen{display:flex;gap:28px;flex-wrap:wrap;background:#fff;border:1px solid var(--linea);border-left:5px solid var(--led);border-radius:10px;padding:12px 14px;margin:0 0 12px}
label{display:block;font-size:14px;color:var(--gris);margin-bottom:10px}
input,select{display:block;width:100%;margin-top:4px;font:16px Barlow,system-ui,sans-serif;color:var(--tinta);background:#fff;border:1px solid #BFC8D3;border-radius:8px;padding:10px;min-height:44px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dos select{margin-top:6px}
.pfila{display:grid;grid-template-columns:1fr 118px 44px;gap:8px;align-items:center;margin-bottom:8px}
.pfila select,.pfila input{margin:0}
.cfila{display:flex;flex-wrap:wrap;gap:0 10px;align-items:flex-end;padding:10px 0;border-bottom:1px solid var(--linea)}
.cfila label{flex:1 1 140px}
.cfila .x{margin-bottom:10px}
label.chk{display:flex;align-items:center;gap:8px;flex:1 1 60%;color:var(--tinta);min-height:44px}
label.chk input{width:22px;height:22px;min-height:0;margin:0;flex:none;accent-color:var(--tabla)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:10px 16px;border-radius:10px;border:2px solid var(--tabla);background:var(--tabla);color:#fff;font:600 16px Barlow,system-ui,sans-serif;text-decoration:none;cursor:pointer}
.btn.sec{background:#fff;color:var(--tabla)}
.btn.wa{background:#1F8A4C;border-color:#1F8A4C}
.btn.peligro{background:var(--mal);border-color:var(--mal)}
.btn.chico{min-height:36px;padding:6px 12px;font-size:14px}
.btn.ancho{width:100%;margin-bottom:6px}
.btn:disabled{opacity:.55}
.x{width:44px;height:44px;border:1px solid var(--linea);background:#fff;border-radius:8px;font-size:22px;color:var(--gris);cursor:pointer;flex:none}
.fila-btn{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.acciones{display:flex;gap:8px}
.nota{font-size:13px;color:var(--gris);margin:8px 0 0}
.vacio{background:#fff;border:1px dashed #B9C3CF;border-radius:12px;padding:18px;color:var(--gris);margin:14px 0}
.lista .item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);border-radius:10px;padding:10px 14px;margin-bottom:8px}
h3.mini{font:700 19px var(--cond);margin:16px 0 8px;color:var(--tabla)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linea);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{background:none;border:0;padding:12px 0 14px;font:600 15px Barlow,system-ui,sans-serif;color:var(--gris);cursor:pointer}
nav.tabs button.on{color:var(--tabla);box-shadow:inset 0 4px 0 var(--tabla)}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--tabla2);color:#fff;padding:11px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;max-width:92vw;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
#toast.err{background:var(--mal)}
.firma{max-width:720px;margin:8px auto 0;padding:18px 16px 26px;display:flex;align-items:center;justify-content:center;gap:12px;border-top:1px solid var(--linea)}
.firma .hecho{font-size:13px;color:var(--gris)}
.firma .icono{width:40px;height:66px;flex:none}
.firma .marca-sam{display:flex;flex-direction:column;gap:1px;font-family:Poppins,system-ui,sans-serif;font-size:18px;line-height:1.15}
.firma .sol{font-weight:500;letter-spacing:-.6px;color:#1B6E7D}
.firma .am{font-weight:400;letter-spacing:4.5px;color:#152226;display:inline-block}
.firma .regla{display:block;width:100%;height:9px;margin-top:3px}
.tabla{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--linea);border-radius:12px;margin-bottom:14px}
.tabla table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tabla th,.tabla td{padding:8px 10px;text-align:right;white-space:nowrap;border-top:1px solid var(--linea)}
.tabla th{background:#F6F8FA;font:700 13px Barlow,system-ui,sans-serif;color:var(--gris);border-top:0}
.tabla th:first-child,.tabla td:first-child{text-align:left;position:sticky;left:0;background:#fff;font-weight:600;box-shadow:1px 0 0 var(--linea)}
.tabla th:first-child{background:#F6F8FA}
.tabla tr.tot td{border-top:2px solid var(--tabla);font-weight:700;background:#FAFBFC}
.tabla td.cero{color:#B9C3CF}
.cal{background:#fff;border:1px solid var(--linea);border-left:5px solid #1B6E7D;border-radius:10px;padding:14px;margin-bottom:14px}
.cal h3{margin:0 0 4px;font:700 19px var(--cond);color:#14606D}
.cal .link{font-size:12px;color:var(--gris);word-break:break-all;background:#F6F8FA;border-radius:6px;padding:7px 9px;margin:9px 0 0}
.disc{background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden;margin-bottom:10px}
.disc-cab{padding:11px 14px 8px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.disc-cab h4{margin:0;font:700 17px var(--cond);flex:1}
.disc-cuerpo{padding:0 14px 12px;font-size:14px;line-height:1.55;color:var(--tinta)}
.disc-meta{font-size:13px;color:var(--gris);margin-bottom:5px}
.badge{display:inline-block;font:700 12px Barlow,system-ui,sans-serif;padding:3px 9px;border-radius:20px;margin-left:6px}
.badge.pend{background:#FFF3CD;color:#856404}
.badge.res{background:#D4EDDA;color:#155724}
.badge.ap{background:#CCE5FF;color:#004085}
.badge.ep{background:#E2E3E5;color:#383D41}
.btn.cal1{background:#1B6E7D;border-color:#1B6E7D}
.btn.cal2{background:#fff;color:#1B6E7D;border-color:#1B6E7D}
.evento .cat .vs{font-weight:400;color:var(--gris);font-size:14px}
.evento{display:grid;grid-template-columns:66px 1fr auto;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
#ver{cursor:pointer;-webkit-user-select:none;user-select:none}
:focus-visible{outline:3px solid var(--led);outline-offset:2px}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
@media (max-width:420px){.finde h1{font-size:27px}.fila{grid-template-columns:60px 1fr auto;gap:10px}}
</style>
</head>

function pad(n){ return (n < 10 ? '0' : '') + n; }
function s2d(s){ var a = String(s).split('-'); return new Date(Date.UTC(+a[0], +a[1]-1, +a[2])); }
function d2s(d){ return d.getUTCFullYear() + '-' + pad(d.getUTCMonth()+1) + '-' + pad(d.getUTCDate()); }
function addDias(s, n){ var d = s2d(s); d.setUTCDate(d.getUTCDate()+n); return d2s(d); }
function dow(s){ return s2d(s).getUTCDay(); }
/* Cada semana (lunes a domingo) se identifica por su sábado. */
function findeDe(s){ var w = dow(s); return w === 0 ? addDias(s, -1) : addDias(s, 6 - w); }
function findeActual(hoy){ return findeDe(hoy); }
function esFinde(s){ var w = dow(s); return w === 0 || w === 6; }

function statsDe(tiras, cfg, P, anio, sem){

  return d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + 'T' +
    pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
}

function eventosDe(tiras, cfg, P, clubId, catId){
  var nomCat = {}, nomClub = {}, nomArb = {}, nomTor = {}, dur = Number(P.duracionMin) || 90, evs = [];
  (cfg.categorias || []).forEach(function(k){ nomCat[k.id] = k.nombre; });

  (cfg.torneos || []).forEach(function(k){ nomTor[k.id] = k.nombre; });

    if (clubId && t.local !== clubId && t.rivalId !== clubId) return;
    var titulo = (nomClub[t.local] || '?') + ' vs ' + (t.rivalId ? (nomClub[t.rivalId] || '?') : t.rivalTxt);
    (t.partidos || []).forEach(function(x){
      if (catId && x.cat !== catId) return;

/* Devuelve los partidos sin árbitros cuyo inicio está en menos de horasAviso horas. */

      if (a1 && a1 === a2) err('No puede ser el mismo árbitro en las dos funciones.');
      x.a1 = a1; x.a2 = a2; S.putTira(td); return {ok:true};
    }
    case 'pago': {
      if (!esColegio(p.clave)) err('Clave del Colegio incorrecta.');
      var tp = S.getTira(p.tiraId); if (!tp) err('Esa tira ya no existe.');
      tp.pagada = !!p.pagada; tp.monto = tp.pagada ? totalTira(tp, cfg, P) : 0;
      S.putTira(tp); return {ok:true, tira:tp};
    }
    case 'stats': {
      if (!(p.clave && (String(p.clave) === String(P.claveStats) || String(p.clave) === String(P.claveABT)))) err('Clave incorrecta.');
      var r = statsDe(S.getTiras(''), cfg, P, p.anio || ahora.slice(0, 4), p.sem || '');
      r.ok = true; return r;
    }
    case 'guardarConfig':
      return guardarConfig_(p, S, cfg, esABT);
  }
  err('Acción desconocida: ' + action);
}

function guardarTira_(p, S, cfg, P, ahora, c){
  function err(m){ throw new Error(m); }
  var t = p.tira || {};
  if (!/^\d{4}-\d{2}-\d{2}$/.test(t.fecha || '')) err('Elegí el día.');
  var fin = findeDe(t.fecha);
  var prev = t.id ? S.getTira(t.id) : null;
  if (prev && prev.local !== c.id) err('Esa tira no es de tu club.');
  if (prev && ahora >= cierreTira(prev, P)) err('La carga de esa tira ya cerró.');
  if (prev && prev.pagada) err('La tira figura como pagada. Pedile al Colegio que la pase a pendiente para editarla.');
  var rivalId = (t.rivalId && t.rivalId !== c.id && (cfg.clubes || []).some(function(k){ return k.id === t.rivalId; })) ? t.rivalId : '';
  var rivalTxt = rivalId ? '' : String(t.rivalTxt || '').trim();
  if (!rivalId && !rivalTxt) err('Indicá contra quién juegan.');
  var sede = String(t.sede || '').trim(); if (!sede) err('Indicá la sede o cancha.');
  var torneo = (t.torneo && (cfg.torneos || []).some(function(k){ return k.id === t.torneo; })) ? t.torneo : '';
  var ps = t.partidos || []; if (!ps.length) err('Cargá al menos una categoría.');
  var old = {}; (prev ? prev.partidos : []).forEach(function(x){ old[x.id] = x; });
  var cats = {}; (cfg.categorias || []).forEach(function(k){ cats[k.id] = k.nombre; });
  var partidos = ps.map(function(x){
    if (!cats[x.cat]) err('Hay un partido sin categoría.');
    if (!/^\d{2}:\d{2}$/.test(x.hora || '')) err('Falta la hora de ' + cats[x.cat] + '.');
    var o = x.id && old[x.id];
    return {id: o ? o.id : uid(), cat:x.cat, hora:x.hora, a1: o ? o.a1 : '', a2: o ? o.a2 : ''};
  });
  var n = {id: prev ? prev.id : uid(), local:c.id, rivalId:rivalId, rivalTxt:rivalTxt, fecha:t.fecha, finde:fin, sede:sede, torneo:torneo, partidos:partidos, pagada:false, monto:0, act:ahora};
  var cn = cierreTira(n, P);
  if (ahora >= cn) err('Ya no se puede cargar para ese día: la carga cerró el ' + cn.slice(8,10) + '/' + cn.slice(5,7) + ' a las ' + cn.slice(11) + '.');
  S.putTira(n);
  return {ok:true, tira:n};
}

function guardarConfig_(p, S, cfg, esABT){
  function err(m){ throw new Error(m); }
  if (!esABT(p.clave)) err('Clave de la ABT incorrecta.');
  var v = p.valor, parte = p.parte, P = paramsDe(cfg);
  if (parte === 'params'){
    var np = {};
    for (var k in DEF_PARAMS) np[k] = (v && v[k] !== undefined && v[k] !== '') ? v[k] : P[k];
    ['arbitrosPorPartido','cierreDia','minEntrePartidos','extraCambioSede','anticipacionHoras','duracionMin','horasAviso'].forEach(function(k){
      np[k] = Number(np[k]); if (isNaN(np[k]) || np[k] < 0) err('Revisá los números de las reglas.');
    });
    if (!/^\d{2}:\d{2}$/.test(np.cierreHora)) err('La hora de cierre tiene que ser HH:MM.');
    ['claveColegio','claveABT','claveStats','claveHTD'].forEach(function(k){ np[k] = String(np[k]).trim(); if (!np[k]) err('Las claves no pueden quedar vacías.'); });
    if (np.claveStats === np.claveColegio) err('La clave de estadísticas tiene que ser distinta a la del Colegio.');
    v = np;
  } else if (parte === 'clubes' || parte === 'categorias' || parte === 'arbitros' || parte === 'torneos'){
    if (!Array.isArray(v)) err('Datos inválidos.');
    var vistos = {};
    v = v.map(function(r){
      var o = {id: (r.id && !vistos[r.id]) ? String(r.id) : uid(), nombre: String(r.nombre || '').trim()};
      vistos[o.id] = 1;
      if (!o.nombre) err('Hay una fila sin nombre.');
      if (parte === 'clubes'){ o.pin = String(r.pin || '').trim(); o.sede = String(r.sede || '').trim(); if (!o.pin) err('Falta el PIN de ' + o.nombre + '.'); var viejo_=(cfg.clubes||[]).filter(function(k){return k.id===o.id;})[0]; var rawNew_=String(r.linkDrive||'').trim(); o.escudo=rawNew_?driveImgURL_(rawNew_):(viejo_?viejo_.escudo||'':''); }
      if (parte === 'categorias'){ o.arancel = Number(r.arancel); if (r.arancel === '' || isNaN(o.arancel) || o.arancel < 0) err('Revisá el arancel de ' + o.nombre + '.'); o.libre = r.libre === true || r.libre === 'true'; }
      if (parte === 'arbitros'){ o.tel = String(r.tel || '').trim(); }
      return o;
    });
  } else err('Sección desconocida.');
  S.setConfig(parte, v); cfg[parte] = v;
  return {ok:true, config:cfgABT_(cfg, paramsDe(cfg))};
}

/* ---------- Comunicación (JSONP por GET: anda en Safari) ---------- */
function api(action, p, reintento){
  if (!API_URL) return new Promise(function(res){ setTimeout(function(){
    try { res(JSON.parse(JSON.stringify(core_handle(action, p || {}, MOCK, ahoraLocal())))); }
    catch (e) { res({ok:false, error:e.message}); }
  }, 120); });
  return new Promise(function(res){
    var cb = 'cb' + Math.random().toString(36).slice(2), s = document.createElement('script'), listo = false;
    var espera = action === 'stats' ? 75000 : 35000;
    var to = setTimeout(function(){ fin({ok:false, red:true, error:'El servidor tardó demasiado en responder.'}); }, espera);
    function fin(r){
      if (listo) return; listo = true; clearTimeout(to);
      window[cb] = function(){}; s.remove();
      /* Un corte de red suelto no es un error: se reintenta solo una vez (salvo al crear una tira, para no duplicarla). */
      var maxInt = (action === 'estado' || action === 'stats') ? 2 : 1;
      var veces = Number(reintento) || 0;
      if (r.red && veces < maxInt && !(action === 'guardarTira' && !(p && p.tira && p.tira.id)))
        return setTimeout(function(){ api(action, p, veces + 1).then(res); }, 1500 * (veces + 1));
      res(r);
    }
    window[cb] = fin;
    s.onerror = function(){ fin({ok:false, red:true, error:'No se pudo conectar con el servidor. Revisá la conexión y probá de nuevo.'}); };
    s.src = API_URL + '?action=' + action + '&p=' + encodeURIComponent(JSON.stringify(p || {})) + '&cb=' + cb + '&_=' + Date.now();
    document.body.appendChild(s);
  });
}

function escudoFijo(nombre){
  if (!nombre) return '';
  var n = nombre.toLowerCase();
  for (var k in ESCUDOS_FIJOS){
    if (n.indexOf(k) >= 0 || k.indexOf(n) >= 0) return ESCUDOS_FIJOS[k];
  }
  /* matching parcial: Ferro Carril Sud matchea con "ferro" */
  var palabras = n.split(/\s+/);
  for (var i = 0; i < palabras.length; i++){
    if (palabras[i].length < 3) continue;
    for (var k in ESCUDOS_FIJOS){
      if (k.indexOf(palabras[i]) >= 0 || palabras[i].indexOf(k.split(' ')[0]) >= 0) return ESCUDOS_FIJOS[k];
    }
  }
  return '';
}
function escudoURL(clubId){
  var c = S.cfg ? (S.cfg.clubes||[]).filter(function(k){return k.id===clubId;})[0] : null;
  if (c && c.escudo) return 'data:image/jpeg;base64,' + c.escudo;
  /* buscar en escudos fijos por nombre del club */
  if (c && c.nombre){ var f = escudoFijo(c.nombre); if (f) return 'data:image/jpeg;base64,' + f; }
  return '';
}
function escudoImg(clubId, size){
  var u = escudoURL(clubId);
  if (!u) return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:var(--linea);display:flex;align-items:center;justify-content:center;font-size:'+(size*0.4)+'px;color:var(--gris)">🏀</div>';
  return '<img src="'+u+'" alt="" style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;flex:none">';
}


/* ---------- Vista de invitado: alguien abrió un link de tira ---------- */
async function cargarDisc(){
  if (!S.club) return;
  var r = await api('disciplina', {club:S.club.id, pin:S.club.pin});
  if (r.ok){ S.disc = r.notifs; render(); }
}
async function cargarDiscABT(){
  if (!S.abt) return;
  var r = await api('disciplina', {clave:S.abt.clave, solo:'leer'});
  if (r.ok){ S.discABT = r.notifs; render(); }
}
async function cargarAvisos(){
  if (!S.club && !S.colegio && !S.abt) return;
  var p2 = S.club ? {club:S.club.id, pin:S.club.pin} : {clave:S.colegio || (S.abt && S.abt.clave)};
  var r = await api('avisos', p2);
  if (r.ok){ S.avisos = r.sinArbitros; render(); }
}
/* ---------- Compartir al calendario ---------- */
function baseURL(){ return location.origin + location.pathname; }
function linkTira(id){ return baseURL() + '?t=' + id; }
function linkSemana(club, finde, cat){ return baseURL() + '?c=' + club + '&s=' + finde + (cat ? '&k=' + cat : ''); }
function bajarICS(texto, nombre){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], {type:'text/calendar;charset=utf-8'}));
  a.download = nombre.replace(/[^\w\-]+/g, '-') + '.ics';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function copiar(txt){
  try { await navigator.clipboard.writeText(txt); toast('Link copiado'); }
  catch (e) { toast('Mantené apretado el link para copiarlo', true); }
}
async function cargarInvitado(){
  var q = S.invQ, r = q.t ? await api('tira', {id:q.t}) : await api('semana', {club:q.c, finde:q.s, cat:q.k || ''});
  S.inv = r.ok ? r : {error:r.error};
  render();
}
function vInvitado(){
  var e = S.inv;
  if (!e) return '<p class="vacio">Buscando los partidos…</p>';
  if (e.error) return '<p class="vacio">' + esc(e.error) + ' <button class="btn sec chico" onclick="verTodo()">Ver la cartelera</button></p>';
  var ev = e.eventos, unSolo = ev.every(function(x){ return x.quien === ev[0].quien && x.sede === ev[0].sede; });
  var h = '<section class="cal"><h3>' + esc(e.titulo) + '</h3>' +
    (unSolo ? '<div class="sub">' + fechaLarga(ev[0].fecha) + ' · ' + esc(ev[0].sede) + '</div>' : '<div class="sub">' + ev.length + ' partidos</div>');
  var dia = '', sede = '';
  ev.forEach(function(x){
    if (!unSolo && x.fecha !== dia){ dia = x.fecha; sede = ''; h += '<h3 class="mini">' + fechaLarga(x.fecha) + '</h3>'; }

async function cargar(silencioso){
  var r = await api('estado', {finde:S.finde});
  if (!r.ok){
    S.offline = !!r.red;
    if (silencioso && S.cfg){ render(); return; }   /* refresco automático: sin cartel, se sigue mostrando lo último */
    toast(r.error, true);
    if (!S.cfg) $('#main').innerHTML = '<p class="vacio">No se pudo cargar la cartelera. ' + esc(r.error) + ' <button class="btn sec chico" onclick="cargar()">Reintentar</button></p>';
    return;
  }
  S.offline = false;
  /* Preservar escudos locales si el servidor los devuelve vacíos */
  if (S.cfg && S.cfg.clubes) {
    (r.config.clubes || []).forEach(function(c){
      if (!c.escudo) {
        var viejo = S.cfg.clubes.filter(function(k){ return k.id === c.id; })[0];
        if (viejo && viejo.escudo) c.escudo = viejo.escudo;
      }
    });
  }
  S.cfg = r.config; S.tiras = r.tiras; S.ahora = r.ahora; render();
  if (S.club) cargarDisc();
  if (S.abt) cargarDiscABT();
  cargarAvisos();
}

    '<td>' + plata(sumTot) + '</td><td>' + plata(sumPend) + '</td></tr>');

  /* 2. Árbitros por mes */
  h += '<h2 class="dia">Cobrado por cada árbitro, mes a mes</h2>';
  var sumM = z12(), sumA = 0, sumP = 0;
  var f2 = e.arbitros.map(function(a){
    sumA += a.tot; sumP += a.partidos;
    return '<tr><td>' + esc(a.nombre) + '</td>' + MS.map(function(m){
      sumM[m] += a.mes[m]; return celda(a.mes[m], plata);
    }).join('') + '<td>' + a.partidos + '</td><td>' + plata(a.tot) + '</td></tr>';
  });
  h += f2.length ? tabla(['Árbitro'].concat(MS.map(function(m){ return MESES3[m]; })).concat(['Partidos', 'Total']), f2,
    '<tr class="tot"><td>Todos</td>' + MS.map(function(m){ return '<td>' + plata(sumM[m]) + '</td>'; }).join('') +
    '<td>' + sumP + '</td><td>' + plata(sumA) + '</td></tr>')
    : '<p class="vacio">Todavía no hay designaciones cargadas en este período.</p>';

  /* 3. Partidos por categoría */
  h += '<h2 class="dia">Partidos jugados por categoría</h2>';
  var cs = e.categorias, sumC = {}, sumCP = 0;
  var f3 = e.clubes.map(function(c){
    sumCP += c.partidos;
    return '<tr><td>' + esc(c.nombre) + '</td>' + cs.map(function(k){
      var v = c.cats[k.id] || 0; sumC[k.id] = (sumC[k.id] || 0) + v; return celda(v, String);
    }).join('') + '<td>' + c.partidos + '</td></tr>';
  });
  h += tabla(['Club'].concat(cs.map(function(k){ return k.nombre; })).concat(['Total']), f3,
    '<tr class="tot"><td>Todos</td>' + cs.map(function(k){ return '<td>' + (sumC[k.id] || 0) + '</td>'; }).join('') + '<td>' + sumCP + '</td></tr>');
  h += '<p class="nota">Cuenta los partidos de local y de visitante de cada club. El gasto, en cambio, es solo el de las tiras que juega de local.</p>';
  h += '<div class="fila-btn"><button class="btn sec" onclick="bajarCSV()">Descargar todo en CSV</button></div>';
  return h;
}
function bajarCSV(){
  var e = S.stats, MS = rangoStats(e), L = [], q = function(x){ return '"' + String(x).replace(/"/g, '""') + '"'; };
  L.push([q('Cartelera y Designaciones · ABT'), q(e.anio), q(e.sem === '1' ? '1er semestre' : e.sem === '2' ? '2do semestre' : 'Año completo')].join(';'), '');
  L.push(q('Gasto por club y torneo'));
  L.push([q('Club')].concat(e.torneos.map(function(t){ return q(t.nombre); })).concat([q('Total'), q('Sin pagar')]).join(';'));
  e.clubes.forEach(function(c){ L.push([q(c.nombre)].concat(e.torneos.map(function(t){ return c.tor[t.id] || 0; })).concat([c.tot, c.pend]).join(';')); });
  L.push('', q('Cobrado por árbitro'));
  L.push([q('Árbitro')].concat(MS.map(function(m){ return q(MESES3[m]); })).concat([q('Partidos'), q('Total')]).join(';'));
  e.arbitros.forEach(function(a){ L.push([q(a.nombre)].concat(MS.map(function(m){ return a.mes[m]; })).concat([a.partidos, a.tot]).join(';')); });
  L.push('', q('Partidos por categoría'));
  L.push([q('Club')].concat(e.categorias.map(function(k){ return q(k.nombre); })).concat([q('Total')]).join(';'));
  e.clubes.forEach(function(c){ L.push([q(c.nombre)].concat(e.categorias.map(function(k){ return c.cats[k.id] || 0; })).concat([c.partidos]).join(';')); });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + L.join('\n')], {type:'text/csv;charset=utf-8'}));
  a.download = 'ABT-' + e.anio + (e.sem ? '-sem' + e.sem : '') + '.csv';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

}
function seccion(parte, tit, campos, nota, alta){
  var L = S.abt.cfg[parte] = S.abt.cfg[parte] || [];
  return '<section class="panel"><h2>' + tit + '</h2>' + (nota ? '<p class="nota" style="margin:-4px 0 6px">' + nota + '</p>' : '') +
    L.map(function(r, i){
      return '<div class="cfila">' + campos.map(function(f){
        if (f[2] === 'checkbox') return '<label class="chk"><input type="checkbox"' + (r[f[0]] === true || r[f[0]] === 'true' ? ' checked' : '') + ' onchange="S.abt.cfg.' + parte + '[' + i + '].' + f[0] + '=this.checked">' + f[1] + '</label>';
        return '<label>' + f[1] + '<input type="' + f[2] + '"' + (f[2] === 'number' ? ' inputmode="numeric"' : '') + (f[3] ? ' placeholder="' + f[3] + '"' : '') +

    }).join('') +

}

    '<section class="panel"><h2>Reglas y claves</h2>' +

    '<label>Email para avisos automáticos de falta de árbitro<input type="email" value="' + esc(p.emailABT || '') + '" placeholder="correo@ejemplo.com"' + set('emailABT') + '></label>' +

  h += vDiscABT();

async function guardarCfg(parte){
  var r = await api('guardarConfig', {clave:S.abt.clave, parte:parte, valor:S.abt.cfg[parte]});
  if (!r.ok) return toast(r.error, true);
  S.abt.cfg = r.config; if (parte === 'params') S.abt.clave = r.config.params.claveABT;
  toast('Cambios guardados'); cargar();
}

/* ---------- HTD (Honorable Tribunal de Disciplina) ---------- */
async function entrarHTD(){
  var k = $('#lh').value.trim(); if (!k) return toast('Escribí la clave.', true);
  var r = await api('loginHTD', {clave:k});
  if (!r.ok) return toast(r.error, true);
  S.htdClave = k; S.htd = r.notifs; render();
}
async function recargarHTD(){
  if (!S.htdClave) return;
  var r = await api('loginHTD', {clave:S.htdClave});
  if (r.ok){ S.htd = r.notifs; render(); }
}
async function guardarResolucion(notifId){
  var ed = S.htdEd; if (!ed) return;
  var txt = (ed.texto||'').trim(); if (!txt) return toast('Escribí el texto de la resolución.',true);
  var r = await api('resolucion', {clave:S.htdClave, notifId:notifId, texto:txt, estado:ed.estado||'en proceso'});
  if (!r.ok) return toast(r.error, true);
  S.htdEd = null; toast('Resolución guardada'); await recargarHTD(); render();
}
function vHTD(){
  if (!S.htd) return loginHTML('Honorable Tribunal de Disciplina', 'lh', 'entrarHTD', 'Acceso exclusivo para integrantes del HTD.');
  var disc = S.htd, ed = S.htdEd;
  var pend = disc.filter(function(n){ return !n.resolucion; }).length;
  var h = '<div class="cabclub"><div><h2>HTD</h2><p class="sub">Honorable Tribunal de Disciplina · ' +
    disc.length + ' caso' + (disc.length!==1?'s':'') + ', ' + pend + ' sin resolver</p></div>' +
    '<button class="btn sec chico" onclick="salir(\'htd\')">Salir</button></div>';
  if (!disc.length) return h + '<p class="vacio">No hay notificaciones cargadas por el Colegio ni por la ABT.</p>';
  h += disc.map(function(n){
    var clubes = S.cfg ? (n.clubes||[]).map(function(id){ var cc=(S.cfg.clubes||[]).filter(function(k){return k.id===id;})[0]; return cc?cc.nombre:id; }).join(', ') : (n.clubes||[]).join(', ');
    var catNoms = S.cfg ? (n.clubes||[]).map(function(id){ var cc=(S.cfg.clubes||[]).filter(function(k){return k.id===id;})[0]; return cc?cc.nombre:id; }).join(', ') : '';
    var colE = n.estado==='resuelto'?'res':n.estado==='pendiente'?'pend':'ep';
    var card = '<article class="tira" style="margin-bottom:14px"><div class="tira-cab">' +
      '<h3 style="font-size:20px">' + esc(n.texto.slice(0,70)) + (n.texto.length>70?'…':'') +
      ' <span class="badge ' + colE + '">' + esc(n.estado.charAt(0).toUpperCase()+n.estado.slice(1)) + '</span></h3>' +
      '<div class="sub">Clubes: ' + esc(clubes) + ' · Infracción: ' + fechaLarga(n.fecha) +
      ' · Enviado por: ' + (n.emisor==='colegio'?'Colegio de Árbitros':'ABT') + '</div></div>';
    // informe
    card += '<div style="padding:10px 14px;border-top:1px solid var(--linea)">' +
      '<div class="disc-meta">📋 Informe</div><p style="margin:4px 0 0;font-size:14px">' + esc(n.texto) + '</p></div>';
    // descargo
    if (n.descargo && n.descargo.texto){
      var dcClub = S.cfg ? (S.cfg.clubes||[]).filter(function(k){return k.id===n.descargo.club;})[0] : null;
      card += '<div style="padding:10px 14px;border-top:1px solid var(--linea);background:#F6F8FA">' +
        '<div class="disc-meta">📩 Descargo' + (dcClub?' de '+esc(dcClub.nombre):'') + ' — ' + fechaLarga(n.descargo.act.slice(0,10)) + '</div>' +
        '<p style="margin:4px 0 0;font-size:14px">' + esc(n.descargo.texto) + '</p></div>';
    } else {
      card += '<div style="padding:8px 14px;border-top:1px solid var(--linea)"><span class="disc-meta">📩 Sin descargo del club aún</span></div>';
    }
    // resolución
    if (n.resolucion && n.resolucion.texto){
      var colR = n.resolucion.estado==='resuelto'?'res':n.resolucion.estado==='apelado'?'ap':'ep';
      card += '<div style="padding:10px 14px;border-top:2px solid var(--tabla);background:#EDF6F8">' +
        '<div class="disc-meta">⚖️ Resolución — ' + fechaLarga(n.resolucion.act.slice(0,10)) + ' <span class="badge '+colR+'">' + esc(n.resolucion.estado.charAt(0).toUpperCase()+n.resolucion.estado.slice(1)) + '</span></div>' +
        '<p style="margin:4px 0 8px;font-size:14px">' + esc(n.resolucion.texto) + '</p>' +
        '<button class="btn sec chico" onclick="S.htdEd={notifId:\'' + n.id + '\',texto:' + JSON.stringify(n.resolucion.texto) + ',estado:\'' + n.resolucion.estado + '\'};render()">Editar resolución</button></div>';
    } else {
      card += '<div style="padding:10px 14px;border-top:2px solid var(--tabla)">' +
        '<button class="btn chico" onclick="S.htdEd={notifId:\'' + n.id + '\',texto:\'\',estado:\'en proceso\'};render()">Cargar resolución</button></div>';
    }
    // editor de resolución
    if (ed && ed.notifId === n.id){
      card += '<div style="padding:12px 14px;border-top:1px solid var(--linea);background:#FAFBFC">' +
        '<label style="font-size:14px;color:var(--gris);display:block;margin-bottom:4px">Texto de la resolución</label>' +
        '<textarea rows="5" style="display:block;width:100%;font:16px Barlow,system-ui,sans-serif;border:1px solid #BFC8D3;border-radius:8px;padding:10px;resize:vertical" oninput="S.htdEd.texto=this.value">' + esc(ed.texto) + '</textarea>' +
        '<label style="display:block;margin-top:8px;font-size:14px;color:var(--gris)">Estado del caso</label>' +
        '<select style="display:block;width:100%;margin-top:4px;font:16px Barlow,system-ui,sans-serif;border:1px solid #BFC8D3;border-radius:8px;padding:10px;min-height:44px" onchange="S.htdEd.estado=this.value">' +
          '<option value="en proceso"' + (ed.estado==='en proceso'?' selected':'') + '>En proceso</option>' +
          '<option value="resuelto"' + (ed.estado==='resuelto'?' selected':'') + '>Resuelto</option>' +
          '<option value="apelado"' + (ed.estado==='apelado'?' selected':'') + '>Apelado</option>' +
        '</select>' +
        '<div class="fila-btn" style="margin-top:10px">' +
          '<button class="btn" onclick="guardarResolucion(\'' + n.id + '\')">Guardar resolución</button>' +
          '<button class="btn sec" onclick="S.htdEd=null;render()">Cancelar</button>' +
        '</div></div>';
    }
    return card + '</article>';
  }).join('');
  return h;
}
